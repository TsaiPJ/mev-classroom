<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一次性設定｜匯入正解</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="login-shell">
  <div class="panel">
    <div class="eyebrow">一次性設定</div>
    <h1>匯入正解到 Firestore</h1>
    <p>用教師帳號登入後按一次「寫入正解」即可。正解會存進只有教師讀得到的位置，學生端永遠拿不到。</p>
    <form id="login-form">
      <label>教師 Email<input id="email" type="email" autocomplete="username" required></label>
      <label>密碼<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" id="login-btn">登入</button>
    </form>
    <button id="seed" class="hidden">寫入正解</button>
    <p id="message" class="message" role="status"></p>
    <p class="hint">寫入成功後，請把這個 setup.html 從 GitHub repo 刪掉（正解就不會再出現在任何公開檔案裡）。日後要改正解，再把它放回去執行一次。</p>
  </div>
</main>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

// 正解：題號 → 正確選項的索引（0 = A、1 = B、2 = C、3 = D）
const ANSWER_KEY = {
  pre1: 0,   // 對
  pre2: 1,   // 錯
  pre3: 0,   // 對
  pre4: 1,   // 錯
  pre5: 1,   // 錯
  post1: 0,  // 外膜
  post2: 1,  // 某些分子可能被選擇性富集
  post3: 1,  // 取決於來源、內容物、接受細胞及環境
  post4: 2,  // 檢查純度並加入排除游離成分的對照組
  post5: 1,  // 來源菌株、顆粒特性、活性、安全性及批次品質
};

const $ = id => document.getElementById(id);
const app = initializeApp(window.MEV_FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

$("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  $("login-btn").disabled = true;
  $("message").className = "message";
  $("message").textContent = "登入中…";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); }
  catch (err) { $("message").className = "message error"; $("message").textContent = "登入失敗：" + err.code; }
  finally { $("login-btn").disabled = false; }
});

onAuthStateChanged(auth, user => {
  if (!user) return;
  $("login-form").classList.add("hidden");
  $("seed").classList.remove("hidden");
  $("message").textContent = `已登入 ${user.email}，可以寫入正解。`;
});

$("seed").onclick = async () => {
  $("seed").disabled = true;
  try {
    await setDoc(doc(db, "mevQuiz", window.MEV_ROOM_ID, "meta", "key"),
      { correct: ANSWER_KEY, updatedAt: serverTimestamp() });
    $("message").className = "message";
    $("message").textContent = `✅ 已寫入 ${Object.keys(ANSWER_KEY).length} 題正解到房間「${window.MEV_ROOM_ID}」。現在可以把 setup.html 刪掉了。`;
  } catch (err) {
    $("message").className = "message error";
    $("message").textContent = "寫入失敗：" + err.code + "（請確認安全規則已更新、且登入的是教師帳號）";
  } finally { $("seed").disabled = false; }
};
</script>
</body>
</html>
